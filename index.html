<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Календарь занятий</title>
<meta name="description" content="Занятия, события, финансы и расписание — работает офлайн">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#252525">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Календарь">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var t = localStorage.getItem('lessoncal_theme');
    var light = t==='light' || (t==='auto' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(light) document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<script src="./app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* offline-first still works without it */ });
  });
}
</script>
</body>
</html>
